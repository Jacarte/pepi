# Pepi SWE-bench evals on labeled pull requests (docs: evals/README.md, "CI (GitHub Actions)").
#
# PR labeled `run-evals` (same-repo PRs only; the report removes the label, so adding it again re-runs):
#   lookup ──┬─ baseline  (main's config, only on a cache miss) ──┐
#            └─ candidate (the PR's config) ─────────────────────┴─ report (narrate + new PR comment)
# Push to main: lookup ── baseline (main's harness and config) ── saves the shared baseline cache.
#
# The PR's harness (evals/ code) runs both evals; only the Pi config differs (main vs PR), both passed
# as PEPI_EVAL_CONFIG_DIR. Each arm uses its own profile and ordinary AGENTS.md, for every preset
# (never fall back to the PR config for main). Secrets PI_AUTH (auth.json content)
# and EVAL_ENV (.env content) live in the GitHub Environment `pepi-evals` (required reviewers): only
# baseline, candidate and report reference it, so each waits for approval.
# Repository variables: PROFILE (required), EVAL_PRESET, EVAL_IDS,
# EVAL_RUNS_ON and optional pins (see the env block below).
# baseline/candidate run on a self-hosted runner by default (task images need ~60 GB of disk); lookup and
# report always run on GitHub-hosted runners (no Docker; report holds the secrets and a write token).
#
# Security: never use pull_request_target here, and never put GitHub expressions inside `run:`
# scripts (pass values through `env:`). The PR's own code runs with the secrets, so approve a run only
# after reading the PR's diff (workflow, profile.sh and harness included). Actions are pinned by major
# tag; pinning them by commit SHA is recommended.

name: pepi-evals

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main]

permissions:
  contents: read

# One eval per PR: re-labeling cancels the running one. Unrelated label events get their own group,
# so they never cancel an eval. Pushes to main never cancel a running baseline; GitHub keeps at most one
# pending run per group, so a newer push replaces an older one still waiting (the cache ends up warm for
# the latest main).
concurrency:
  group: >-
    ${{ github.event_name == 'push' && 'pepi-evals-main' ||
        (github.event.label.name == 'run-evals' && format('pepi-evals-pr-{0}', github.event.pull_request.number) ||
        format('pepi-evals-unrelated-{0}', github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PEPI_CI_PROFILE: ${{ vars.PROFILE }}
  PEPI_CI_PRESET: ${{ vars.EVAL_PRESET || 'verified20-v1' }}
  # Optional comma-separated task ids (empty = the whole preset), e.g. a 4-task smoke for a first run.
  # Part of the cache key, so a subset baseline is never mistaken for a full one.
  PEPI_CI_IDS: ${{ vars.EVAL_IDS }}
  # Public locators only; the evaluator token is scoped to checkout steps below.
  WASMTIME_TASKS_REPOSITORY: ${{ vars.WASMTIME_TASKS_REPOSITORY }}
  WASMTIME_TASKS_REVISION: ${{ vars.WASMTIME_TASKS_REVISION }}
  # Pins: the defaults repeat evals/ci/run-evals.sh. Every value also goes into the cache key.
  PEPI_CI_PI_VERSION: ${{ vars.EVAL_PI_VERSION || '1.1.0' }}
  PEPI_CI_SUBAGENTS_VERSION: ${{ vars.EVAL_SUBAGENTS_VERSION || '0.78.0' }}
  PEPI_CI_LITELLM_VERSION: ${{ vars.EVAL_LITELLM_VERSION || '4.2.0' }}
  PEPI_CI_NODE_IMAGE: ${{ vars.EVAL_NODE_IMAGE || 'node:22-bookworm-slim' }}
  # Empty = preset default (Verified: 300 s, Multilingual: 600 s, Wasmtime: 1800 s).
  PEPI_CI_TIMEOUT_SECONDS: ${{ vars.EVAL_TIMEOUT_SECONDS }}
  PEPI_CI_CPUS: ${{ vars.EVAL_CPUS || '4' }}
  PEPI_CI_MEMORY: ${{ vars.EVAL_MEMORY || '8g' }}
  PEPI_CI_NARRATE_MODEL: ${{ vars.EVAL_NARRATE_MODEL }}
  PEPI_CI_PYTHON_VERSION: '3.12'
  PEPI_CI_SWEBENCH_VERSION: '5.0.2'
  # Fallback SWE-bench harness revision when the preset JSON does not pin `swebench_revision`.
  PEPI_CI_SWEBENCH_REVISION: 02e7a74ffd0b707aab73d203fe87bdc7c76afc8e

jobs:
  lookup:
    name: lookup baseline cache
    if: >-
      github.event_name == 'push' ||
      (github.event.label.name == 'run-evals' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Always GitHub-hosted: no Docker and no secrets here (it runs before any environment approval).
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.cache.outputs.cache-hit }}
      harness_sha: ${{ steps.refs.outputs.harness_sha }}
      main_sha: ${{ steps.refs.outputs.main_sha }}
      config_sha256: ${{ steps.config.outputs.sha256 }}
      task_source: ${{ steps.preset.outputs.task_source }}
      task_repository: ${{ steps.preset.outputs.task_repository }}
      task_revision: ${{ steps.preset.outputs.task_revision }}
      dataset: ${{ steps.preset.outputs.dataset }}
      swebench_revision: ${{ steps.preset.outputs.swebench_revision }}
    steps:
      # Repository variables only: the secrets live in the pepi-evals environment, which this job does not
      # reference (each eval job checks them before doing anything).
      - name: Check configuration
        env:
          EVAL_RUNS_ON: ${{ vars.EVAL_RUNS_ON }}
        run: |
          set -euo pipefail
          problems=0
          if [[ -z "${PEPI_CI_PROFILE:-}" ]]; then
            echo "::error::Repository variable PROFILE is not set (a directory name under profiles/, e.g. bedrock)."
            problems=1
          elif [[ ! "$PEPI_CI_PROFILE" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$ ]]; then
            echo "::error::Repository variable PROFILE has unsafe characters."
            problems=1
          fi
          case "$PEPI_CI_PRESET" in
            verified20-v1|multilingual10-v1|wasmtime-safe-v1) ;;
            *) echo "::error::Repository variable EVAL_PRESET must be verified20-v1, multilingual10-v1 or wasmtime-safe-v1."; problems=1 ;;
          esac
          for name in PEPI_CI_PI_VERSION PEPI_CI_SUBAGENTS_VERSION PEPI_CI_LITELLM_VERSION; do
            if [[ ! "${!name}" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]{0,63}$ ]]; then
              echo "::error::$name is not a plain version string."
              problems=1
            fi
          done
          if [[ -n "$PEPI_CI_TIMEOUT_SECONDS" && ! "$PEPI_CI_TIMEOUT_SECONDS" =~ ^[0-9]+$ ]]; then
            echo "::error::Repository variable EVAL_TIMEOUT_SECONDS must be a whole number of seconds."
            problems=1
          fi
          if [[ ! "$PEPI_CI_CPUS" =~ ^[0-9]+(\.[0-9]+)?$ || ! "$PEPI_CI_MEMORY" =~ ^[0-9]+[bkmg]?$ ]]; then
            echo "::error::Repository variables EVAL_CPUS / EVAL_MEMORY must look like 4 / 8g."
            problems=1
          fi
          # SWE-bench ids only (owner__repo-NUMBER), comma-separated: never a path the harness could read.
          task_id='[A-Za-z0-9][A-Za-z0-9_.-]*__[A-Za-z0-9][A-Za-z0-9_.-]*-[0-9]+'
          if [[ "$PEPI_CI_PRESET" == wasmtime-safe-v1 ]]; then
            task_id='bytecodealliance__wasmtime-[0-9]+-safe-v1-l8rcyy'
          fi
          if [[ -n "${PEPI_CI_IDS:-}" && ! "$PEPI_CI_IDS" =~ ^$task_id(,$task_id)*$ ]]; then
            echo "::error::Repository variable EVAL_IDS must be comma-separated task ids such as sympy__sympy-16886 (no spaces)."
            problems=1
          fi
          if [[ -n "${EVAL_RUNS_ON:-}" ]] && ! python3 -c 'import json, re, sys
          labels = json.loads(sys.argv[1])
          ok = isinstance(labels, list) and labels and all(isinstance(label, str) and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.-]{0,63}", label) for label in labels)
          sys.exit(0 if ok else 1)' "$EVAL_RUNS_ON" 2>/dev/null; then
            echo "::error::Repository variable EVAL_RUNS_ON must be a JSON array of runner labels, e.g. [\"self-hosted\",\"pepi-evals\"] or [\"ubuntu-latest\"]."
            problems=1
          fi
          if [[ "$PEPI_CI_PRESET" == wasmtime-safe-v1 ]]; then
            if [[ ! "${WASMTIME_TASKS_REPOSITORY:-}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
              echo "::error::WASMTIME_TASKS_REPOSITORY must name a separate evaluator owner/repo (see evals/swebench/README.md)."
              problems=1
            fi
            if [[ ! "${WASMTIME_TASKS_REVISION:-}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::WASMTIME_TASKS_REVISION must be a pinned 40-hex commit, not a branch or tag."
              problems=1
            fi
            if ! python3 -c 'import json, sys
          labels = json.loads(sys.argv[1])
          sys.exit(0 if isinstance(labels, list) and {"self-hosted", "pepi-evals"} <= set(labels) else 1)' "${EVAL_RUNS_ON:-[\"self-hosted\",\"pepi-evals\"]}" 2>/dev/null; then
              echo "::error::wasmtime-safe-v1 requires EVAL_RUNS_ON labels self-hosted and pepi-evals; hosted runners are not allowed."
              problems=1
            fi
          fi
          exit "$problems"

      - name: Check out the harness (PR head, or main on push)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false

      - name: Check out main for the baseline config
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          path: config-src
          persist-credentials: false

      # On pull_request GitHub runs this file from the PR's merge commit (github.sha), while the jobs and the
      # cache key use the PR head's checkout: refuse a head that does not carry the workflow being executed.
      - name: Check out the executing workflow file
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: executing
          sparse-checkout: .github/workflows/pepi-evals.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check that the harness carries the executing workflow
        run: |
          set -euo pipefail
          executing=executing/.github/workflows/pepi-evals.yml
          head=harness/.github/workflows/pepi-evals.yml
          [[ -f "$executing" ]] || { echo "::error::could not read the executing workflow file"; exit 1; }
          if [[ ! -f "$head" ]] || ! cmp -s "$executing" "$head"; then
            echo "::error::The PR head's .github/workflows/pepi-evals.yml differs from the workflow GitHub is running" \
              "(the PR merged with main). Rebase the PR on main so it carries the current workflow and evals/ helpers," \
              "then add the run-evals label again."
            exit 1
          fi

      - name: Record commits
        id: refs
        env:
          EVENT_HARNESS_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          harness_sha=$(git -C harness rev-parse HEAD)
          main_sha=$(git -C config-src rev-parse HEAD)
          [[ "$harness_sha" == "$EVENT_HARNESS_SHA" ]] || { echo "::error::harness checkout is not the event commit"; exit 1; }
          [[ "$harness_sha" =~ ^[0-9a-f]{40}$ && "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          { echo "harness_sha=$harness_sha"; echo "main_sha=$main_sha"; } >> "$GITHUB_OUTPUT"
          echo "harness $harness_sha, baseline config from main $main_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PEPI_CI_PYTHON_VERSION }}

      # Only parser setup may fetch from the network; the smoke tests below are entirely offline.
      - name: Ensure the workflow-test YAML parser is available
        working-directory: harness
        run: |
          set -euo pipefail
          python -c 'import yaml' 2>/dev/null || python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run the offline CI smoke tests
        working-directory: harness
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python -m unittest \
            evals.swebench.tests.test_ci_workflow evals.swebench.tests.test_ci_helpers \
            evals.swebench.tests.test_ci evals.swebench.tests.test_reporting \
            evals.swebench.tests.test_wasmtime_ci evals.swebench.tests.test_cooperative

      - name: Resolve the preset
        id: preset
        working-directory: harness
        run: |
          set -euo pipefail
          python3 - "$PEPI_CI_PRESET" "$PEPI_CI_SWEBENCH_REVISION" >> "$GITHUB_OUTPUT" <<'PY'
          import os, re, sys
          preset, fallback = sys.argv[1], sys.argv[2]
          from evals.swebench.preset import preset_definition, preset_ids
          data = preset_definition(preset)
          repository = ""
          if preset == "verified20-v1":
              source, revision = "verified", data["task_repo_revision"]
          elif preset == "multilingual10-v1":
              source, revision = "multilingual", data["dataset_revision"]
          elif preset == "wasmtime-safe-v1":
              source = "wasmtime"
              repository = os.environ.get("WASMTIME_TASKS_REPOSITORY", "")
              revision = os.environ.get("WASMTIME_TASKS_REVISION", "").lower()
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9][A-Za-z0-9_.-]*", repository):
                  raise SystemExit("WASMTIME_TASKS_REPOSITORY must be a separate evaluator owner/repo")
              if repository.lower() == os.environ.get("GITHUB_REPOSITORY", "").lower():
                  raise SystemExit("WASMTIME_TASKS_REPOSITORY must not be this public repository")
              if not re.fullmatch(r"[0-9a-f]{40}", revision):
                  raise SystemExit("WASMTIME_TASKS_REVISION must be a pinned 40-hex commit")
              ids = os.environ.get("PEPI_CI_IDS", "")
              selected = ids.split(",") if ids else preset_ids(preset).read_text().splitlines()
              if len(set(selected)) != len(selected) or not set(selected) <= set(preset_ids(preset).read_text().splitlines()):
                  raise SystemExit("EVAL_IDS must select only wasmtime-safe-v1 IDs, without duplicates")
          else:
              raise SystemExit(f"unsupported preset {preset}")
          swebench = data.get("swebench_revision") or fallback
          for value in (revision, swebench):
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit("preset revisions must be 40-hex commit shas")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_./-]{0,127}", data["dataset"]):
              raise SystemExit("unsafe dataset name")
          print(f"task_source={source}")
          print(f"task_repository={repository}")
          print(f"task_revision={revision}")
          print(f"swebench_revision={swebench}")
          print(f"dataset={data['dataset']}")
          PY

      - name: Assemble the baseline config (main + profile.sh PROFILE, no secrets)
        id: config
        working-directory: harness
        run: |
          set -euo pipefail
          python3 -m evals.swebench.ci assemble-config --repo "$GITHUB_WORKSPACE/config-src" \
            --profile "$PEPI_CI_PROFILE" --out "$RUNNER_TEMP/pepi-config-baseline" \
            --fallback-root "$GITHUB_WORKSPACE/harness" > "$RUNNER_TEMP/pepi-config-baseline.json"
          cat "$RUNNER_TEMP/pepi-config-baseline.json"
          sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/pepi-config-baseline.json")
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Compute the baseline cache key
        id: key
        working-directory: harness
        env:
          TASK_REVISION: ${{ steps.preset.outputs.task_revision }}
          TASK_REPOSITORY: ${{ steps.preset.outputs.task_repository }}
          SWEBENCH_REVISION: ${{ steps.preset.outputs.swebench_revision }}
          DATASET: ${{ steps.preset.outputs.dataset }}
        # baseline's "Recheck the cache key" step repeats this cache-key command: keep the two identical.
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/pepi-config-baseline"
          key_json="$RUNNER_TEMP/pepi-cache-key.json"
          # This workflow decides how the evals run, so its bytes are part of the key too.
          workflow_sha=$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' \
            .github/workflows/pepi-evals.yml)
          python3 -m evals.swebench.ci cache-key --harness-root . \
            --config-dir "$config_dir" \
            --profile "$PEPI_CI_PROFILE" --preset "$PEPI_CI_PRESET" \
            --pi-version "$PEPI_CI_PI_VERSION" --subagents-version "$PEPI_CI_SUBAGENTS_VERSION" \
            --litellm-version "$PEPI_CI_LITELLM_VERSION" --node-image "$PEPI_CI_NODE_IMAGE" \
            --task-repo-revision "$TASK_REVISION" --swebench-revision "$SWEBENCH_REVISION" \
            --python-version "$PEPI_CI_PYTHON_VERSION" --timeout-seconds "$PEPI_CI_TIMEOUT_SECONDS" \
            --cpus "$PEPI_CI_CPUS" --memory "$PEPI_CI_MEMORY" --concurrency 1 --dataset "$DATASET" \
            --ids "${PEPI_CI_IDS:-}" --network "${PEPI_CI_NETWORK:-pepi-eval}" \
            --setting "workflow_sha256=$workflow_sha" --setting "task_repository=${TASK_REPOSITORY:-}" --json > "$key_json"
          cat "$key_json"
          key=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["key"])' "$key_json")
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # PR runs can read caches saved on main and on their own PR ref; a baseline saved by a PR run
      # is visible only to that PR. Pushes to main warm the cache shared by every PR.
      - name: Look up the baseline cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: pepi-baseline-cache
          lookup-only: true

  baseline:
    name: baseline eval (main config)
    needs: lookup
    if: >-
      needs.lookup.outputs.hit != 'true' &&
      (github.event_name == 'push' ||
       (github.event.label.name == 'run-evals' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    environment: pepi-evals
    runs-on: ${{ fromJSON(needs.lookup.outputs.task_source == 'wasmtime' && '["self-hosted","pepi-evals"]' || vars.EVAL_RUNS_ON || '["self-hosted","pepi-evals"]') }}
    # EVAL_RUNS_ON='["ubuntu-latest"]'  (existing presets only; Wasmtime requires self-hosted)
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      status: ${{ steps.run.outputs.status }}
      has_summary: ${{ steps.slim.outputs.has_summary }}
      cacheable: ${{ steps.cacheable.outputs.cacheable }}
    steps:
      - name: Check the pepi-evals environment secrets
        env:
          HAS_PI_AUTH: ${{ secrets.PI_AUTH != '' }}
          HAS_EVAL_ENV: ${{ secrets.EVAL_ENV != '' }}
        run: |
          set -euo pipefail
          problems=0
          if [[ "$HAS_PI_AUTH" != true ]]; then
            echo "::error::Secret PI_AUTH is not set in the pepi-evals environment (the content of an evaluation-only auth.json)."
            problems=1
          fi
          if [[ "$HAS_EVAL_ENV" != true ]]; then
            echo "::error::Secret EVAL_ENV is not set in the pepi-evals environment (.env lines; LITELLM_BASE_URL/LITELLM_API_KEY for LiteLLM profiles)."
            problems=1
          fi
          exit "$problems"

      - name: Check out the harness
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lookup.outputs.harness_sha }}
          path: harness
          persist-credentials: false

      - name: Reset outputs from earlier runs (self-hosted runners keep the workspace)
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/pepi-baseline-cache" "$GITHUB_WORKSPACE/pepi-candidate"

      - name: Free disk space (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          bash harness/evals/ci/free-disk.sh

      - name: Check out main for the baseline config
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lookup.outputs.main_sha }}
          path: config-src
          persist-credentials: false

      - name: Check out the SWE-bench harness (pinned)
        uses: actions/checkout@v4
        with:
          repository: SWE-bench/SWE-bench
          ref: ${{ needs.lookup.outputs.swebench_revision }}
          path: ext/SWE-bench
          persist-credentials: false

      - name: Check out the Verified task repo (pinned)
        if: needs.lookup.outputs.task_source == 'verified'
        uses: actions/checkout@v4
        with:
          repository: SWE-bench/swe-bench-tasks
          ref: ${{ needs.lookup.outputs.task_revision }}
          path: ext/swe-bench-tasks
          persist-credentials: false

      - name: Check Wasmtime runner and network
        if: needs.lookup.outputs.task_source == 'wasmtime'
        run: |
          set -euo pipefail
          [[ "$PEPI_CI_PRESET" == wasmtime-safe-v1 && "$RUNNER_ENVIRONMENT" == self-hosted ]] || { echo "::error::wasmtime-safe-v1 requires a self-hosted pepi-evals runner and unchanged preset."; exit 1; }
          docker network inspect pepi-eval >/dev/null 2>&1 || { echo "::error::Preprovision the operator-managed pepi-eval network with an egress allowlist denying GitHub; CI will not create it for Wasmtime."; exit 1; }

      - name: Check out the Wasmtime evaluator (pinned, never agent input)
        if: needs.lookup.outputs.task_source == 'wasmtime'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.lookup.outputs.task_repository }}
          ref: ${{ needs.lookup.outputs.task_revision }}
          # Public repos use the job token; private repos require a scoped Contents:read token.
          token: ${{ secrets.WASMTIME_TASKS_TOKEN || github.token }}
          path: ext/wasmtime-tasks
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PEPI_CI_PYTHON_VERSION }}

      - name: Build the seven Wasmtime base images (private host logs, no secrets)
        if: needs.lookup.outputs.task_source == 'wasmtime'
        working-directory: harness
        env:
          TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
        run: |
          set -euo pipefail
          receipt_dir=$(mktemp -d "$RUNNER_TEMP/pepi-wasmtime-images.XXXXXX")
          python3 -m evals.swebench.ci build-wasmtime-images \
            --task-repo "$GITHUB_WORKSPACE/ext/wasmtime-tasks" --revision "$TASK_REVISION" \
            --out "$receipt_dir/build"

      - name: Create the swebench venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -e ext/SWE-bench
          version=$("$RUNNER_TEMP/venv/bin/python" -c 'import importlib.metadata as m; print(m.version("swebench"))')
          if [[ "$version" != "$PEPI_CI_SWEBENCH_VERSION" ]]; then
            echo "::error::swebench $version installed; expected $PEPI_CI_SWEBENCH_VERSION"
            exit 1
          fi

      - name: Name the run
        id: names
        env:
          TASK_SOURCE: ${{ needs.lookup.outputs.task_source }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          run_name="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-baseline"
          case "$TASK_SOURCE" in
            verified) task_repo="$GITHUB_WORKSPACE/ext/swe-bench-tasks" ;;
            multilingual) task_repo="$RUNNER_TEMP/swe-bench-tasks-multilingual" ;;
            wasmtime) task_repo="$GITHUB_WORKSPACE/ext/wasmtime-tasks" ;;
            *) echo "::error::unknown task source"; exit 1 ;;
          esac
          {
            echo "run_name=$run_name"
            echo "run_dir=$RUNNER_TEMP/pepi-runs/$run_name"
            echo "task_repo=$task_repo"
          } >> "$GITHUB_OUTPUT"

      - name: Import the Multilingual task repo (pinned dataset revision)
        if: needs.lookup.outputs.task_source == 'multilingual'
        working-directory: harness
        env:
          TASK_REPO: ${{ steps.names.outputs.task_repo }}
          TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
          DATASET: ${{ needs.lookup.outputs.dataset }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -m evals.swebench.multilingual import --dataset "$DATASET" \
            --revision "$TASK_REVISION" --ids "evals/swebench/presets/$PEPI_CI_PRESET.ids" --out "$TASK_REPO"

      - name: Assemble the baseline config (main + profile.sh PROFILE, no secrets)
        working-directory: harness
        env:
          EXPECTED_SHA256: ${{ needs.lookup.outputs.config_sha256 }}
        run: |
          set -euo pipefail
          python3 -m evals.swebench.ci assemble-config --repo "$GITHUB_WORKSPACE/config-src" \
            --profile "$PEPI_CI_PROFILE" --out "$RUNNER_TEMP/pepi-config" \
            --fallback-root "$GITHUB_WORKSPACE/harness" > "$RUNNER_TEMP/pepi-config.json"
          cat "$RUNNER_TEMP/pepi-config.json"
          sha=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/pepi-config.json")
          if [[ "$sha" != "$EXPECTED_SHA256" ]]; then
            echo "::error::baseline config differs from the one the cache key was computed for"
            exit 1
          fi

      # Environment-level variables override repository variables, but only in jobs that reference the
      # environment (this one, not lookup): recompute the key with this job's settings, exactly as lookup did,
      # so a baseline measured with other settings is never saved under lookup's key. Runs before the secrets
      # are written; a mismatch only makes the baseline not cacheable.
      - name: Recheck the cache key with this job's variables (no secrets)
        id: recheck
        working-directory: harness
        env:
          LOOKUP_KEY: ${{ needs.lookup.outputs.key }}
          TASK_REPOSITORY: ${{ needs.lookup.outputs.task_repository }}
          TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
          SWEBENCH_REVISION: ${{ needs.lookup.outputs.swebench_revision }}
          DATASET: ${{ needs.lookup.outputs.dataset }}
        run: |
          set -euo pipefail
          config_dir="$RUNNER_TEMP/pepi-config"
          key_json="$RUNNER_TEMP/pepi-cache-key-recheck.json"
          key=""
          # This workflow decides how the evals run, so its bytes are part of the key too.
          workflow_sha=$(python3 -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' \
            .github/workflows/pepi-evals.yml)
          if python3 -m evals.swebench.ci cache-key --harness-root . \
            --config-dir "$config_dir" \
            --profile "$PEPI_CI_PROFILE" --preset "$PEPI_CI_PRESET" \
            --pi-version "$PEPI_CI_PI_VERSION" --subagents-version "$PEPI_CI_SUBAGENTS_VERSION" \
            --litellm-version "$PEPI_CI_LITELLM_VERSION" --node-image "$PEPI_CI_NODE_IMAGE" \
            --task-repo-revision "$TASK_REVISION" --swebench-revision "$SWEBENCH_REVISION" \
            --python-version "$PEPI_CI_PYTHON_VERSION" --timeout-seconds "$PEPI_CI_TIMEOUT_SECONDS" \
            --cpus "$PEPI_CI_CPUS" --memory "$PEPI_CI_MEMORY" --concurrency 1 --dataset "$DATASET" \
            --ids "${PEPI_CI_IDS:-}" --network "${PEPI_CI_NETWORK:-pepi-eval}" \
            --setting "workflow_sha256=$workflow_sha" --setting "task_repository=${TASK_REPOSITORY:-}" --json > "$key_json"; then
            cat "$key_json"
            key=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["key"])' "$key_json")
          fi
          # The trailing ISO week is left out: a baseline approved after a week boundary still matches.
          week_suffix='-[0-9][0-9][0-9][0-9]-W[0-9][0-9]'
          if [[ -n "$key" && "${key%$week_suffix}" == "${LOOKUP_KEY%$week_suffix}" ]]; then
            echo "matches=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::This job's settings give a different baseline cache key than lookup computed (an environment-level variable on pepi-evals overriding a repository variable?); the baseline will not be cached. Define PROFILE and the EVAL_* variables as repository variables only."
            echo "matches=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write secrets (auth.json, .env)
        working-directory: harness
        env:
          PI_AUTH: ${{ secrets.PI_AUTH }}
          EVAL_ENV: ${{ secrets.EVAL_ENV }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 "$RUNNER_TEMP/pepi-launch"
          python3 -m evals.swebench.ci secrets-setup --dir "$RUNNER_TEMP/pepi-secrets" \
            --launch-dir "$RUNNER_TEMP/pepi-launch" --mask-file "$RUNNER_TEMP/pepi-masks"

      - name: Mask derived secret values
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/pepi-masks"
          rm -f "$RUNNER_TEMP/pepi-masks"

      - name: Run the baseline eval
        id: run
        env:
          RUN_NAME: ${{ steps.names.outputs.run_name }}
          PEPI_CI_TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
          TASK_REPO: ${{ steps.names.outputs.task_repo }}
        run: |
          set -euo pipefail
          export PEPI_CI_SECRETS_DIR="$RUNNER_TEMP/pepi-secrets" PEPI_CI_LAUNCH_DIR="$RUNNER_TEMP/pepi-launch"
          export PEPI_CI_TASK_REPO="$TASK_REPO" PEPI_CI_RUNS_DIR="$RUNNER_TEMP/pepi-runs"
          export PEPI_CI_VENV="$RUNNER_TEMP/venv" PEPI_CI_SWEBENCH_REPO="$GITHUB_WORKSPACE/ext/SWE-bench"
          status=0
          bash harness/evals/ci/run-evals.sh baseline "$RUNNER_TEMP/pepi-config" main "$RUN_NAME" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" != 0 ]]; then
            echo "::warning::pepi-eval.sh exited $status; the report verdict flags it"
          fi

      # cache: the private actions/cache entry; handoff (public 1-day artifact) and artifact (public 30-day)
      # leave out manifest.json/execution.json, because artifacts of a public repository are world-readable.
      - name: Slim the run (cache, handoff and artifact sets)
        id: slim
        working-directory: harness
        env:
          RUN_DIR: ${{ steps.names.outputs.run_dir }}
          EVAL_STATUS: ${{ steps.run.outputs.status }}
        run: |
          set -euo pipefail
          cache_dir="$GITHUB_WORKSPACE/pepi-baseline-cache"
          handoff_dir="$RUNNER_TEMP/pepi-out/baseline-handoff"
          artifact_dir="$RUNNER_TEMP/pepi-out/baseline-artifact"
          mkdir -p "$RUNNER_TEMP/pepi-out"
          if [[ -f "$RUN_DIR/summary.json" ]]; then
            python3 -m evals.swebench.ci slim-run --run "$RUN_DIR" --out "$cache_dir" --kind cache
            python3 -m evals.swebench.ci slim-run --run "$RUN_DIR" --out "$handoff_dir" --kind handoff
            python3 -m evals.swebench.ci slim-run --run "$RUN_DIR" --out "$artifact_dir" --kind artifact
            echo "has_summary=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$cache_dir" "$handoff_dir" "$artifact_dir"
            for dir in "$cache_dir" "$handoff_dir" "$artifact_dir"; do
              printf 'pepi-eval.sh exited %s before writing summary.json; see the job log.\n' "$EVAL_STATUS" > "$dir/NO_SUMMARY.txt"
            done
            echo "has_summary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the baseline may be cached
        id: cacheable
        working-directory: harness
        env:
          HAS_SUMMARY: ${{ steps.slim.outputs.has_summary }}
          EVAL_STATUS: ${{ steps.run.outputs.status }}
          KEY_MATCHES: ${{ steps.recheck.outputs.matches }}
        run: |
          set -euo pipefail
          cacheable=false
          # Only a clean baseline is shared: measured with lookup's settings, exit 0 and a clean single-run verdict.
          if [[ "$KEY_MATCHES" != true ]]; then
            echo "::warning::baseline settings differ from lookup's cache key (see the key recheck step); it is not cached"
          elif [[ "$HAS_SUMMARY" == true && "$EVAL_STATUS" == 0 ]] &&
             python3 -m evals.swebench.ci verdict --single "$GITHUB_WORKSPACE/pepi-baseline-cache" --exit-code 0 > /dev/null; then
            cacheable=true
          else
            echo "::warning::baseline has infrastructure problems; it is not cached"
          fi
          echo "cacheable=$cacheable" >> "$GITHUB_OUTPUT"

      - name: Scan outputs for secrets (blocks upload and cache)
        working-directory: harness
        run: |
          set -euo pipefail
          # The secret values come from the files secrets-setup wrote, so the raw secrets stay out of this step.
          sources=(--secrets-dir "$RUNNER_TEMP/pepi-secrets" --env-file "$RUNNER_TEMP/pepi-launch/.env")
          python3 -m evals.swebench.ci scan-artifacts --dir "$GITHUB_WORKSPACE/pepi-baseline-cache" "${sources[@]}" > /dev/null
          python3 -m evals.swebench.ci scan-artifacts --dir "$RUNNER_TEMP/pepi-out" "${sources[@]}" > /dev/null

      - name: Save the baseline cache
        if: steps.cacheable.outputs.cacheable == 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ needs.lookup.outputs.key }}
          path: pepi-baseline-cache

      - name: Upload the baseline hand-off for the report job
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pepi-evals-baseline-handoff
          path: ${{ runner.temp }}/pepi-out/baseline-handoff
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pepi-evals-baseline
          path: ${{ runner.temp }}/pepi-out/baseline-artifact
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Remove secrets
        if: always()
        run: |
          set -euo pipefail
          if [[ -d harness ]]; then
            (cd harness && python3 -m evals.swebench.ci secrets-cleanup --dir "$RUNNER_TEMP/pepi-secrets" \
              --launch-dir "$RUNNER_TEMP/pepi-launch" --mask-file "$RUNNER_TEMP/pepi-masks" > /dev/null) || true
          fi
          rm -rf -- "$RUNNER_TEMP/pepi-secrets" "$RUNNER_TEMP/pepi-launch" "$RUNNER_TEMP/pepi-masks"

      - name: Remove evaluator checkout
        if: always() && needs.lookup.outputs.task_source == 'wasmtime'
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/ext/wasmtime-tasks"

      - name: Remove agent images (self-hosted only)
        if: always() && runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if [[ -f harness/evals/ci/prune-images.sh ]]; then bash harness/evals/ci/prune-images.sh; fi

  candidate:
    name: candidate eval (PR config)
    needs: lookup
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'run-evals' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: pepi-evals
    runs-on: ${{ fromJSON(needs.lookup.outputs.task_source == 'wasmtime' && '["self-hosted","pepi-evals"]' || vars.EVAL_RUNS_ON || '["self-hosted","pepi-evals"]') }}
    # EVAL_RUNS_ON='["ubuntu-latest"]'  (existing presets only; Wasmtime requires self-hosted)
    timeout-minutes: 350
    permissions:
      contents: read
    outputs:
      status: ${{ steps.run.outputs.status }}
      has_summary: ${{ steps.slim.outputs.has_summary }}
    steps:
      - name: Check the pepi-evals environment secrets
        env:
          HAS_PI_AUTH: ${{ secrets.PI_AUTH != '' }}
          HAS_EVAL_ENV: ${{ secrets.EVAL_ENV != '' }}
        run: |
          set -euo pipefail
          problems=0
          if [[ "$HAS_PI_AUTH" != true ]]; then
            echo "::error::Secret PI_AUTH is not set in the pepi-evals environment (the content of an evaluation-only auth.json)."
            problems=1
          fi
          if [[ "$HAS_EVAL_ENV" != true ]]; then
            echo "::error::Secret EVAL_ENV is not set in the pepi-evals environment (.env lines; LITELLM_BASE_URL/LITELLM_API_KEY for LiteLLM profiles)."
            problems=1
          fi
          exit "$problems"

      - name: Check out the harness and config (PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lookup.outputs.harness_sha }}
          path: harness
          persist-credentials: false

      - name: Free disk space (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          bash harness/evals/ci/free-disk.sh

      - name: Check out the SWE-bench harness (pinned)
        uses: actions/checkout@v4
        with:
          repository: SWE-bench/SWE-bench
          ref: ${{ needs.lookup.outputs.swebench_revision }}
          path: ext/SWE-bench
          persist-credentials: false

      - name: Check out the Verified task repo (pinned)
        if: needs.lookup.outputs.task_source == 'verified'
        uses: actions/checkout@v4
        with:
          repository: SWE-bench/swe-bench-tasks
          ref: ${{ needs.lookup.outputs.task_revision }}
          path: ext/swe-bench-tasks
          persist-credentials: false

      - name: Check Wasmtime runner and network
        if: needs.lookup.outputs.task_source == 'wasmtime'
        run: |
          set -euo pipefail
          [[ "$PEPI_CI_PRESET" == wasmtime-safe-v1 && "$RUNNER_ENVIRONMENT" == self-hosted ]] || { echo "::error::wasmtime-safe-v1 requires a self-hosted pepi-evals runner and unchanged preset."; exit 1; }
          docker network inspect pepi-eval >/dev/null 2>&1 || { echo "::error::Preprovision the operator-managed pepi-eval network with an egress allowlist denying GitHub; CI will not create it for Wasmtime."; exit 1; }

      - name: Check out the Wasmtime evaluator (pinned, never agent input)
        if: needs.lookup.outputs.task_source == 'wasmtime'
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.lookup.outputs.task_repository }}
          ref: ${{ needs.lookup.outputs.task_revision }}
          # Public repos use the job token; private repos require a scoped Contents:read token.
          token: ${{ secrets.WASMTIME_TASKS_TOKEN || github.token }}
          path: ext/wasmtime-tasks
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PEPI_CI_PYTHON_VERSION }}

      - name: Build the seven Wasmtime base images (private host logs, no secrets)
        if: needs.lookup.outputs.task_source == 'wasmtime'
        working-directory: harness
        env:
          TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
        run: |
          set -euo pipefail
          receipt_dir=$(mktemp -d "$RUNNER_TEMP/pepi-wasmtime-images.XXXXXX")
          python3 -m evals.swebench.ci build-wasmtime-images \
            --task-repo "$GITHUB_WORKSPACE/ext/wasmtime-tasks" --revision "$TASK_REVISION" \
            --out "$receipt_dir/build"

      - name: Create the swebench venv
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -e ext/SWE-bench
          version=$("$RUNNER_TEMP/venv/bin/python" -c 'import importlib.metadata as m; print(m.version("swebench"))')
          if [[ "$version" != "$PEPI_CI_SWEBENCH_VERSION" ]]; then
            echo "::error::swebench $version installed; expected $PEPI_CI_SWEBENCH_VERSION"
            exit 1
          fi

      - name: Name the run
        id: names
        env:
          TASK_SOURCE: ${{ needs.lookup.outputs.task_source }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ && "$PR_NUMBER" =~ ^[0-9]+$ ]]
          run_name="ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-pr$PR_NUMBER"
          case "$TASK_SOURCE" in
            verified) task_repo="$GITHUB_WORKSPACE/ext/swe-bench-tasks" ;;
            multilingual) task_repo="$RUNNER_TEMP/swe-bench-tasks-multilingual" ;;
            wasmtime) task_repo="$GITHUB_WORKSPACE/ext/wasmtime-tasks" ;;
            *) echo "::error::unknown task source"; exit 1 ;;
          esac
          {
            echo "run_name=$run_name"
            echo "run_dir=$RUNNER_TEMP/pepi-runs/$run_name"
            echo "task_repo=$task_repo"
            echo "label=pr-$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Import the Multilingual task repo (pinned dataset revision)
        if: needs.lookup.outputs.task_source == 'multilingual'
        working-directory: harness
        env:
          TASK_REPO: ${{ steps.names.outputs.task_repo }}
          TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
          DATASET: ${{ needs.lookup.outputs.dataset }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/python" -m evals.swebench.multilingual import --dataset "$DATASET" \
            --revision "$TASK_REVISION" --ids "evals/swebench/presets/$PEPI_CI_PRESET.ids" --out "$TASK_REPO"

      - name: Assemble the candidate config (PR + profile.sh PROFILE, no secrets)
        working-directory: harness
        run: |
          set -euo pipefail
          python3 -m evals.swebench.ci assemble-config --repo "$GITHUB_WORKSPACE/harness" \
            --profile "$PEPI_CI_PROFILE" --out "$RUNNER_TEMP/pepi-config"

      - name: Write secrets (auth.json, .env)
        working-directory: harness
        env:
          PI_AUTH: ${{ secrets.PI_AUTH }}
          EVAL_ENV: ${{ secrets.EVAL_ENV }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 "$RUNNER_TEMP/pepi-launch"
          python3 -m evals.swebench.ci secrets-setup --dir "$RUNNER_TEMP/pepi-secrets" \
            --launch-dir "$RUNNER_TEMP/pepi-launch" --mask-file "$RUNNER_TEMP/pepi-masks"

      - name: Mask derived secret values
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/pepi-masks"
          rm -f "$RUNNER_TEMP/pepi-masks"

      - name: Run the candidate eval
        id: run
        env:
          RUN_NAME: ${{ steps.names.outputs.run_name }}
          PEPI_CI_TASK_REVISION: ${{ needs.lookup.outputs.task_revision }}
          TASK_REPO: ${{ steps.names.outputs.task_repo }}
          CONFIG_LABEL: ${{ steps.names.outputs.label }}
        run: |
          set -euo pipefail
          export PEPI_CI_SECRETS_DIR="$RUNNER_TEMP/pepi-secrets" PEPI_CI_LAUNCH_DIR="$RUNNER_TEMP/pepi-launch"
          export PEPI_CI_TASK_REPO="$TASK_REPO" PEPI_CI_RUNS_DIR="$RUNNER_TEMP/pepi-runs"
          export PEPI_CI_VENV="$RUNNER_TEMP/venv" PEPI_CI_SWEBENCH_REPO="$GITHUB_WORKSPACE/ext/SWE-bench"
          status=0
          bash harness/evals/ci/run-evals.sh candidate "$RUNNER_TEMP/pepi-config" "$CONFIG_LABEL" "$RUN_NAME" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" != 0 ]]; then
            echo "::warning::pepi-eval.sh exited $status; the report verdict flags it"
          fi

      # handoff (public 1-day artifact) and artifact (public 30-day) leave out manifest.json/execution.json.
      - name: Slim the run (handoff and artifact sets)
        id: slim
        working-directory: harness
        env:
          RUN_DIR: ${{ steps.names.outputs.run_dir }}
          EVAL_STATUS: ${{ steps.run.outputs.status }}
        run: |
          set -euo pipefail
          handoff_dir="$RUNNER_TEMP/pepi-out/candidate-handoff"
          artifact_dir="$RUNNER_TEMP/pepi-out/candidate-artifact"
          mkdir -p "$RUNNER_TEMP/pepi-out"
          if [[ -f "$RUN_DIR/summary.json" ]]; then
            python3 -m evals.swebench.ci slim-run --run "$RUN_DIR" --out "$handoff_dir" --kind handoff
            python3 -m evals.swebench.ci slim-run --run "$RUN_DIR" --out "$artifact_dir" --kind artifact
            echo "has_summary=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$handoff_dir" "$artifact_dir"
            for dir in "$handoff_dir" "$artifact_dir"; do
              printf 'pepi-eval.sh exited %s before writing summary.json; see the job log.\n' "$EVAL_STATUS" > "$dir/NO_SUMMARY.txt"
            done
            echo "has_summary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan outputs for secrets (blocks upload)
        working-directory: harness
        run: |
          set -euo pipefail
          # The secret values come from the files secrets-setup wrote, so the raw secrets stay out of this step.
          python3 -m evals.swebench.ci scan-artifacts --dir "$RUNNER_TEMP/pepi-out" \
            --secrets-dir "$RUNNER_TEMP/pepi-secrets" --env-file "$RUNNER_TEMP/pepi-launch/.env" > /dev/null

      - name: Upload the candidate hand-off for the report job
        uses: actions/upload-artifact@v4
        with:
          name: pepi-evals-candidate-handoff
          path: ${{ runner.temp }}/pepi-out/candidate-handoff
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pepi-evals-candidate
          path: ${{ runner.temp }}/pepi-out/candidate-artifact
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Remove secrets
        if: always()
        run: |
          set -euo pipefail
          if [[ -d harness ]]; then
            (cd harness && python3 -m evals.swebench.ci secrets-cleanup --dir "$RUNNER_TEMP/pepi-secrets" \
              --launch-dir "$RUNNER_TEMP/pepi-launch" --mask-file "$RUNNER_TEMP/pepi-masks" > /dev/null) || true
          fi
          rm -rf -- "$RUNNER_TEMP/pepi-secrets" "$RUNNER_TEMP/pepi-launch" "$RUNNER_TEMP/pepi-masks"

      - name: Remove evaluator checkout
        if: always() && needs.lookup.outputs.task_source == 'wasmtime'
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/ext/wasmtime-tasks"

      - name: Remove agent images (self-hosted only)
        if: always() && runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if [[ -f harness/evals/ci/prune-images.sh ]]; then bash harness/evals/ci/prune-images.sh; fi

  report:
    name: narrate and comment
    needs: [lookup, baseline, candidate]
    # !cancelled() (not always()): runs when the baseline was skipped on a cache hit, but a re-label that
    # cancels this run also stops a report still waiting or running.
    if: >-
      github.event_name == 'pull_request' && !cancelled() &&
      github.event.label.name == 'run-evals' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.lookup.result == 'success' &&
      needs.candidate.result == 'success' &&
      (needs.baseline.result == 'success' ||
       (needs.baseline.result == 'skipped' && needs.lookup.outputs.hit == 'true'))
    environment: pepi-evals
    runs-on: ubuntu-latest
    # Always GitHub-hosted: it holds the secrets and a pull-requests write token; keep it off a self-hosted box.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check the pepi-evals environment secrets
        env:
          HAS_PI_AUTH: ${{ secrets.PI_AUTH != '' }}
          HAS_EVAL_ENV: ${{ secrets.EVAL_ENV != '' }}
        run: |
          set -euo pipefail
          problems=0
          if [[ "$HAS_PI_AUTH" != true ]]; then
            echo "::error::Secret PI_AUTH is not set in the pepi-evals environment (the content of an evaluation-only auth.json)."
            problems=1
          fi
          if [[ "$HAS_EVAL_ENV" != true ]]; then
            echo "::error::Secret EVAL_ENV is not set in the pepi-evals environment (.env lines; LITELLM_BASE_URL/LITELLM_API_KEY for LiteLLM profiles)."
            problems=1
          fi
          exit "$problems"

      - name: Check out the harness (PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.lookup.outputs.harness_sha }}
          path: harness
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PEPI_CI_PYTHON_VERSION }}

      - name: Reset outputs from earlier runs (self-hosted runners keep the workspace)
        run: |
          set -euo pipefail
          rm -rf -- "$GITHUB_WORKSPACE/pepi-baseline-cache" "$GITHUB_WORKSPACE/pepi-candidate"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the pinned Pi CLI (for narrate)
        run: |
          set -euo pipefail
          npm install --global --no-fund --no-audit "@earendil-works/pi-coding-agent@$PEPI_CI_PI_VERSION"
          pi --version

      - name: Restore the cached baseline
        if: needs.lookup.outputs.hit == 'true'
        uses: actions/cache/restore@v4
        with:
          key: ${{ needs.lookup.outputs.key }}
          path: pepi-baseline-cache
          fail-on-cache-miss: true

      - name: Download the fresh baseline
        if: needs.lookup.outputs.hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: pepi-evals-baseline-handoff
          path: pepi-baseline-cache

      - name: Download the candidate
        uses: actions/download-artifact@v4
        with:
          name: pepi-evals-candidate-handoff
          path: pepi-candidate

      - name: Assemble the candidate config (provider/model for narrate, no secrets)
        working-directory: harness
        run: |
          set -euo pipefail
          python3 -m evals.swebench.ci assemble-config --repo "$GITHUB_WORKSPACE/harness" \
            --profile "$PEPI_CI_PROFILE" --out "$RUNNER_TEMP/pepi-config-candidate"
          mkdir -p "$RUNNER_TEMP/pepi-report"

      - name: Write secrets (auth.json, .env)
        working-directory: harness
        env:
          PI_AUTH: ${{ secrets.PI_AUTH }}
          EVAL_ENV: ${{ secrets.EVAL_ENV }}
        run: |
          set -euo pipefail
          mkdir -p -m 700 "$RUNNER_TEMP/pepi-launch"
          python3 -m evals.swebench.ci secrets-setup --dir "$RUNNER_TEMP/pepi-secrets" \
            --launch-dir "$RUNNER_TEMP/pepi-launch" --mask-file "$RUNNER_TEMP/pepi-masks"

      - name: Mask derived secret values
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/pepi-masks"
          rm -f "$RUNNER_TEMP/pepi-masks"

      - name: Narrate (never fails the job)
        run: |
          set -euo pipefail
          export PEPI_CI_SECRETS_DIR="$RUNNER_TEMP/pepi-secrets" PEPI_CI_LAUNCH_DIR="$RUNNER_TEMP/pepi-launch"
          bash harness/evals/ci/narrate.sh "$GITHUB_WORKSPACE/pepi-baseline-cache" "$GITHUB_WORKSPACE/pepi-candidate" \
            "$RUNNER_TEMP/pepi-config-candidate" "$RUNNER_TEMP/pepi-report/narrative.md"

      - name: Verdict (infrastructure problems only)
        id: verdict
        working-directory: harness
        env:
          CACHE_HIT: ${{ needs.lookup.outputs.hit }}
          BASELINE_STATUS: ${{ needs.baseline.outputs.status }}
          CANDIDATE_STATUS: ${{ needs.candidate.outputs.status }}
        run: |
          set -euo pipefail
          args=(--baseline "$GITHUB_WORKSPACE/pepi-baseline-cache" --candidate "$GITHUB_WORKSPACE/pepi-candidate"
                --out "$RUNNER_TEMP/pepi-report/verdict.json")
          # Only clean baselines are cached, so a cache hit stands for exit code 0.
          if [[ "$CACHE_HIT" == true ]]; then args+=(--exit-code-baseline 0)
          elif [[ "$BASELINE_STATUS" =~ ^[0-9]+$ ]]; then args+=(--exit-code-baseline "$BASELINE_STATUS"); fi
          if [[ "$CANDIDATE_STATUS" =~ ^[0-9]+$ ]]; then args+=(--exit-code-candidate "$CANDIDATE_STATUS"); fi
          status=0
          python3 -m evals.swebench.ci verdict "${args[@]}" || status=$?
          case "$status" in
            0) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "ok=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::verdict failed (exit $status)"; exit 1 ;;
          esac

      - name: Build the PR comment
        working-directory: harness
        env:
          CACHE_HIT: ${{ needs.lookup.outputs.hit }}
          HEAD_SHA: ${{ needs.lookup.outputs.harness_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source=fresh
          if [[ "$CACHE_HIT" == true ]]; then source=cached; fi
          python3 -m evals.swebench.ci comment --baseline "$GITHUB_WORKSPACE/pepi-baseline-cache" \
            --candidate "$GITHUB_WORKSPACE/pepi-candidate" --narrative "$RUNNER_TEMP/pepi-report/narrative.md" \
            --sha "$HEAD_SHA" --pr "$PR_NUMBER" --run-url "$RUN_URL" --profile "$PEPI_CI_PROFILE" \
            --preset "$PEPI_CI_PRESET" --baseline-source "$source" \
            --verdict "$RUNNER_TEMP/pepi-report/verdict.json" --out "$RUNNER_TEMP/pepi-report/comment.md"

      - name: Scan the report for secrets (blocks the comment and upload)
        working-directory: harness
        run: |
          set -euo pipefail
          # The secret values come from the files secrets-setup wrote, so the raw secrets stay out of this step.
          python3 -m evals.swebench.ci scan-artifacts --dir "$RUNNER_TEMP/pepi-report" \
            --secrets-dir "$RUNNER_TEMP/pepi-secrets" --env-file "$RUNNER_TEMP/pepi-launch/.env" > /dev/null

      - name: Post a new PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pepi-report/comment.md"

      # The label is consumed, so adding it again starts a new run. Skipped when this run was cancelled (a
      # re-label started a newer run, whose label must stay). Never fails the job.
      - name: Remove the run-evals label
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # REST call (needs only pull-requests: write); 404 = the label is already gone.
          status=0
          output=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/run-evals" 2>&1) || status=$?
          if [[ "$status" != 0 && "$output" != *"HTTP 404"* ]]; then
            echo "::warning::Could not remove the run-evals label; remove it by hand before adding it again."
          fi

      - name: Flag regressions beyond the noise threshold (warning only)
        if: ${{ !cancelled() }}
        working-directory: harness
        run: |
          set -euo pipefail
          # Counts only; score differences never fail the job.
          python3 -m evals.swebench.ci annotate --baseline "$GITHUB_WORKSPACE/pepi-baseline-cache" \
            --candidate "$GITHUB_WORKSPACE/pepi-candidate" || true

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: pepi-evals-report
          path: ${{ runner.temp }}/pepi-report
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Remove secrets
        if: always()
        run: |
          set -euo pipefail
          if [[ -d harness ]]; then
            (cd harness && python3 -m evals.swebench.ci secrets-cleanup --dir "$RUNNER_TEMP/pepi-secrets" \
              --launch-dir "$RUNNER_TEMP/pepi-launch" --mask-file "$RUNNER_TEMP/pepi-masks" > /dev/null) || true
          fi
          rm -rf -- "$RUNNER_TEMP/pepi-secrets" "$RUNNER_TEMP/pepi-launch" "$RUNNER_TEMP/pepi-masks"

      - name: Fail on infrastructure problems
        if: steps.verdict.outputs.ok == 'false'
        run: |
          set -euo pipefail
          echo "::error::Infrastructure problems in the eval runs (see the verdict in the PR comment and the report artifact)."
          exit 1
